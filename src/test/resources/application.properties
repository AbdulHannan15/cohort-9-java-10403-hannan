# Test classpath resources take precedence over main/resources during `mvn test`,
# so @SpringBootTest (CmsApplicationTests) runs against this in-memory H2 config
# instead of requiring a live MySQL instance.

spring.datasource.url=jdbc:h2:mem:cms-test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=test-only-secret-please-do-not-use-in-any-real-environment-32bytes
jwt.expiration-ms=3600000

logging.level.com.Contact.Management.System.Cms=WARN
