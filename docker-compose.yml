version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: contact_management_system
    ports:
      - "3306:3306"
    volumes:
      - cms-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:10-community
    container_name: cms-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - cms-sonarqube-data:/opt/sonarqube/data
      - cms-sonarqube-extensions:/opt/sonarqube/extensions
      - cms-sonarqube-logs:/opt/sonarqube/logs

  sonar-db:
    image: postgres:16
    container_name: cms-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - cms-sonar-db-data:/var/lib/postgresql/data

volumes:
  cms-mysql-data:
  cms-sonarqube-data:
  cms-sonarqube-extensions:
  cms-sonarqube-logs:
  cms-sonar-db-data:
