# Alternative to `mvn sonar:sonar` (which already works via the sonar.* properties
# set in pom.xml). Use this if you run the generic sonar-scanner CLI/Docker image
# from the repo root instead.

sonar.projectKey=cms-backend
sonar.projectName=Contact Management System - Backend
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports
sonar.exclusions=**/DTO/**,**/SupportingEnum/**,**/CmsApplication.java
